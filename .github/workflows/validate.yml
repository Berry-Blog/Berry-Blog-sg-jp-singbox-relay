name: Validate scripts and sing-box config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n sb
          bash -n tests/test-config.sh

      - name: Check VLESS export and Alpine subscription wiring
        run: |
          grep -Fq 'while IFS= read -r uri; do' sb
          grep -Fq 'extra_exits' sb
          grep -Fq 'sg-via-' sb
          grep -Fq '33）添加美国' sb
          grep -Fq '36）删除已添加的落地机' sb
          grep -Fq 'find_httpd_binary' sb
          grep -Fq 'command="$HTTPD_BIN"' sb
          grep -Fq 'busybox-extras' sb
          grep -Fq '本地 YAML，手动导入' sb
          grep -Fq 'HTTPS，需配置反向代理' sb

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-yaml

      - name: Download official sing-box 1.13.21
        run: |
          mkdir -p /tmp/sing-box-test
          curl -fL --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.21/sing-box-1.13.21-linux-amd64-glibc.tar.gz \
            -o /tmp/sing-box.tar.gz
          echo "ab8c8b38665612a62856ac52f2393098c4b78ba8c91a055a722e849c681c745a  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box-test
          BIN="$(find /tmp/sing-box-test -type f -name sing-box | head -n 1)"
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Validate original JP and multi-exit Reality/SS routing, exports and YAML
        run: |
          bash tests/test-config.sh
