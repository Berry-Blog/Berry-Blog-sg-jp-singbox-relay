name: Validate scripts and sing-box config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bash-and-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n install.sh
          bash -n sb
          bash -n tests/test-config.sh
          bash -n tests/test-global-relay.sh
          python3 -m py_compile global_relay.py tests/test_global_relay.py

      - name: Check unified line manager wiring
        run: |
          grep -Fq 'line_manager_menu(){' sb
          grep -Fq 'add_line(){' sb
          grep -Fq 'edit_line(){' sb
          grep -Fq 'delete_line(){' sb
          grep -Fq 'set_default_line(){' sb
          grep -Fq 'entrance_settings(){' sb
          grep -Fq 'migrate_legacy_data(){' sb
          grep -Fq 'schema_version:5' sb
          grep -Fq '21）Global 多家宽管理' sb
          grep -Fq 'global_route_valid "$global_id"' sb
          grep -Fq 'global_relay.py' install.sh
          grep -Fq 'global_relay.py' sb
          grep -Fq 'update_global_profile' global_relay.py
          grep -Fq 'REPO_RAW=' sb
          grep -Fq 'write_vless_links(){' sb
          grep -Fq 'write_clash_yaml(){' sb
          grep -Fq 'sync_subscription_file(){' sb
          ! grep -Fq '33）添加美国 / 其他落地机' sb
          ! grep -Fq 'change_string(){' sb
          ! grep -Fq 'change_number(){' sb

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-yaml

      - name: Download official sing-box 1.13.21
        run: |
          mkdir -p /tmp/sing-box-test
          curl -fL --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.21/sing-box-1.13.21-linux-amd64-glibc.tar.gz \
            -o /tmp/sing-box.tar.gz
          echo "ab8c8b38665612a62856ac52f2393098c4b78ba8c91a055a722e849c681c745a  /tmp/sing-box.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box-test
          BIN="$(find /tmp/sing-box-test -type f -name sing-box | head -n 1)"
          test -n "$BIN"
          sudo install -m 0755 "$BIN" /usr/local/bin/sing-box
          sing-box version

      - name: Validate legacy migration, unified routes and exports
        run: |
          bash tests/test-config.sh

      - name: Validate Global imports, routes, UUID separation, links and status
        run: |
          python3 -m unittest tests/test_global_relay.py
          bash -x tests/test-global-relay.sh

